<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Perfect Sound: level bars with peak caps on a dark LCD tile. MIT, see LICENSE. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2F38"/>
      <stop offset="1" stop-color="#14171C"/>
    </linearGradient>
    <linearGradient id="lcd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1410"/>
      <stop offset="1" stop-color="#050907"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1FAE4B"/>
      <stop offset="0.7" stop-color="#39FF6A"/>
      <stop offset="1" stop-color="#B8FF5A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#39FF6A" stop-opacity="0.10"/>
    </radialGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#tile)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="106.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>
  <rect x="76" y="76" width="360" height="360" rx="44" fill="url(#lcd)"/>
  <rect x="76" y="76" width="360" height="360" rx="44" fill="url(#glow)"/>
  <g fill="url(#bar)">
    <rect x="135" y="276" width="44" height="120" rx="6"/>
    <rect x="201" y="190" width="44" height="206" rx="6"/>
    <rect x="267" y="134" width="44" height="262" rx="6"/>
    <rect x="333" y="226" width="44" height="170" rx="6"/>
  </g>
  <g fill="#FFC640">
    <rect x="135" y="250" width="44" height="12" rx="4"/>
    <rect x="201" y="164" width="44" height="12" rx="4"/>
    <rect x="267" y="108" width="44" height="12" rx="4"/>
    <rect x="333" y="200" width="44" height="12" rx="4"/>
  </g>
</svg>
